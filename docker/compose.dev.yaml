# Dev overlay. Hardcoded credentials are intentional — never reuse in staging/prod.
#
# Up:    docker compose -f docker/compose.yaml -f docker/compose.dev.yaml up
# Down:  docker compose -f docker/compose.yaml -f docker/compose.dev.yaml down

services:
  postgres:
    environment:
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: app_owner_pw
      POSTGRES_DB: bnr
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    command:
      - "postgres"
      - "-c"
      - "log_statement=ddl"
      - "-c"
      - "log_min_duration_statement=200"

  backend:
    image: oven/bun:1.3-alpine
    working_dir: /workspace/backend
    # Mount repo root for bun workspaces; named volumes keep macOS-built
    # node_modules from shadowing the container's Linux-built ones.
    volumes:
      - ..:/workspace:cached
      - workspace_node_modules:/workspace/node_modules
      - backend_node_modules:/workspace/backend/node_modules
      - bnr_storage:/var/lib/bnr/storage
    environment:
      PORT: "3001"
      # Dev uses the owner connection for both; staging/prod split them.
      DATABASE_URL: postgres://app_owner:app_owner_pw@postgres:5432/bnr
      DATABASE_OWNER_URL: postgres://app_owner:app_owner_pw@postgres:5432/bnr
      AUDIT_HASH_SECRET: dev-audit-secret-not-for-production
      STORAGE_DIR: /var/lib/bnr/storage
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    # `exec` so PID 1 is bun → Ctrl+C delivers SIGINT to the runtime.
    command:
      - sh
      - -c
      - |
        set -e
        echo "[backend] installing deps…"
        bun install --frozen-lockfile
        echo "[backend] running migrations…"
        bun run db:migrate
        echo "[backend] seeding dev data (idempotent)…"
        bun run db:seed
        echo "[backend] starting hot-reload server…"
        exec bun run --hot src/index.ts

volumes:
  workspace_node_modules:
  backend_node_modules:
